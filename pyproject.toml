[project]
name = "anon"
version = "0.1.0"
description = "On-prem anonymisation of Liechtenstein court decisions (Word -> reviewable Word with tracked changes)"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",        # BSD
    "openpyxl>=3.1",    # MIT
    "PyYAML>=6.0",      # MIT
    "typer>=0.12",      # MIT
]

[project.optional-dependencies]
# NER on CPU. All Apache-2.0; pulls torch (BSD). Weights come from `anon setup-models`.
ner = ["gliner2>=2.0", "gliner>=0.2.20"]
dev = ["pytest>=8"]

[project.scripts]
anon = "anon.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anon*"]

[tool.setuptools.package-data]
anon = ["config/*.yaml", "config/gazetteers/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "libreoffice: needs a LibreOffice installation (soffice + python3-uno)",
]
