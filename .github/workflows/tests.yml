name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    # Full suite incl. the independent LibreOffice (UNO) accept/reject check.
    # Test documents are never in the repository; tests use synthetic files.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LibreOffice + UNO
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  windows:
    # Windows is a target platform; LibreOffice tests skip themselves here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
